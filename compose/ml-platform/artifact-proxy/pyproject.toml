[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-mlflow-artifact-proxy"
version = "0.1.0"
requires-python = ">=3.11"
description = "Resolve server-internal MLflow proxy artifacts to the configured store"

[project.entry-points."mlflow.artifact_repository"]
mlflow-artifacts = "homelab_artifact_proxy:artifact_repository"

[tool.setuptools]
py-modules = ["homelab_artifact_proxy"]
