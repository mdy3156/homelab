name: homelab-ml-platform

x-common: &common
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    user: "999:999"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: bind
        source: /srv/homelab/postgres/data
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    networks:
      - database
    shm_size: 128m
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seaweedfs:
    <<: *common
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY in .env}
      S3_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:?Set MLFLOW_ARTIFACT_BUCKET in .env}
    volumes:
      - type: bind
        source: /srv/homelab/seaweedfs/data
        target: /data
        bind:
          create_host_path: false
    ports:
      - "192.168.0.8:8333:8333"
    networks:
      - artifacts
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 60s
    healthcheck:
      # Master + filer checks. Signed S3 access is separately checked by MLflow.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mlflow:
    <<: *common
    image: homelab/mlflow:3.16.1-r4
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      MLFLOW_BOTO_CLIENT_ADDRESSING_STYLE: path
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:?Set MLFLOW_ARTIFACT_BUCKET in .env}
      MLFLOW_SERVER_ALLOWED_HOSTS: "192.168.0.8:5000,ubuntu-infra:5000,mlflow:5000,localhost:5000,127.0.0.1:5000,mlflow.ysakurai.dev"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://192.168.0.8:5000,http://ubuntu-infra:5000,mlflow.ysakurai.dev"
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
      # Tracking only: default GenAI job consumers are unnecessary on this VM.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # Avoid a concurrent import deadlock in demo scorer telemetry on 3.16.1.
      MLFLOW_DISABLE_TELEMETRY: "true"
      # Bound the demo's local evaluation concurrency on this small VM.
      MLFLOW_GENAI_EVAL_MAX_WORKERS: "2"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "192.168.0.8:5000:5000"
    networks:
      - database
      - artifacts
    mem_limit: 1024m
    cpus: 1.5
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  database:
    internal: true
  artifacts:
    driver: bridge
