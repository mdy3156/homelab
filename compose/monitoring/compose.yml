name: homelab-monitoring

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Asia/Tokyo
      # Use SQLite; the optional embedded MariaDB is unnecessary on this VM.
      UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB: "0"
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - type: bind
        source: /srv/homelab/uptime-kuma/data
        target: /app/data
        bind:
          create_host_path: false
    ports:
      - "192.168.0.8:3001:3001"
    networks:
      - monitoring
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 60s
    # Preserve the HTTP healthcheck shipped in the pinned upstream image.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    driver: bridge
